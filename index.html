<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Interface de caisse - Système de point de vente moderne et intuitif">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Caisse">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>Interface de Caisse</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pos-container">
        <!-- Left Panel - Products -->
        <div class="products-panel">
            <!-- Categories -->
            <div class="categories-bar">
                <button class="category-btn active" data-category="all" id="cat-all">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/>
                        <rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/>
                        <rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/>
                        <rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    Tout
                </button>
                <button class="category-btn" data-category="cafe" id="cat-cafe">Café</button>
                <button class="category-btn" data-category="desserts" id="cat-desserts">Desserts</button>
                <button class="category-btn" data-category="boissons" id="cat-boissons">Boissons</button>
                <button class="category-btn" data-category="snacks" id="cat-snacks">Snacks</button>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-container" id="search-container">
                    <button class="toolbar-btn" id="search-toggle-btn" title="Rechercher">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </button>
                    <input type="text" class="search-input" id="search-input" placeholder="Rechercher un produit...">
                </div>
                <button class="toolbar-btn" id="add-product-btn" title="Ajouter un produit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
                <button class="toolbar-btn" id="edit-mode-btn" title="Modifier les produits">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                </button>
            </div>

            <!-- Products Grid -->
            <div class="products-grid" id="products-grid">
                <!-- Products will be injected here -->
            </div>
        </div>

        <!-- Right Panel - Cart -->
        <div class="cart-panel">
            <!-- Cart Header -->
            <div class="cart-header">
                <span class="cart-title">Ticket</span>
                <button class="clear-cart-btn" id="clear-cart-btn" title="Vider le panier">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>

            <!-- Cart Items -->
            <div class="cart-items" id="cart-items">
                <div class="cart-empty" id="cart-empty">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"/>
                        <circle cx="20" cy="21" r="1"/>
                        <path d="m1 1 4 4h13l3-4"/>
                        <path d="M5 5v13a2 2 0 0 0 2 2h12"/>
                    </svg>
                    <p>Aucun article</p>
                </div>
            </div>

            <!-- Cart Totals -->
            <div class="cart-totals" id="cart-totals">
                <div class="total-row">
                    <span>Sous-total</span>
                    <span id="subtotal">0,00</span>
                </div>
                <div class="total-row">
                    <span>TVA (20%)</span>
                    <span id="vat">0,00</span>
                </div>
            </div>

            <!-- Charge Button -->
            <div class="charge-section">
                <button class="charge-btn" id="charge-btn" disabled>
                    <span class="charge-text">Encaisser 0,00 €</span>
                </button>
                <button class="keypad-btn" id="keypad-btn" title="Pavé numérique">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="5" height="5" rx="0.5"/>
                        <rect x="10" y="3" width="5" height="5" rx="0.5"/>
                        <rect x="17" y="3" width="5" height="5" rx="0.5"/>
                        <rect x="3" y="10" width="5" height="5" rx="0.5"/>
                        <rect x="10" y="10" width="5" height="5" rx="0.5"/>
                        <rect x="17" y="10" width="5" height="5" rx="0.5"/>
                        <rect x="3" y="17" width="5" height="5" rx="0.5"/>
                        <rect x="10" y="17" width="5" height="5" rx="0.5"/>
                        <rect x="17" y="17" width="5" height="5" rx="0.5"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Add Product -->
    <div class="modal-overlay" id="modal-add-product">
        <div class="modal">
            <div class="modal-header">
                <h2>Ajouter un produit</h2>
                <button class="modal-close" id="modal-add-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="product-name">Nom du produit</label>
                    <input type="text" id="product-name" placeholder="Ex: Cappuccino" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="product-price">Prix (€)</label>
                    <input type="number" id="product-price" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="product-category">Catégorie</label>
                    <select id="product-category">
                        <option value="cafe">Café</option>
                        <option value="desserts">Desserts</option>
                        <option value="boissons">Boissons</option>
                        <option value="snacks">Snacks</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="product-color">Couleur</label>
                    <div class="color-picker" id="color-picker">
                        <button class="color-swatch active" data-color="#f5f5f5" style="background:#f5f5f5;border:1px solid #ddd"></button>
                        <button class="color-swatch" data-color="#e8f5e9" style="background:#e8f5e9"></button>
                        <button class="color-swatch" data-color="#e3f2fd" style="background:#e3f2fd"></button>
                        <button class="color-swatch" data-color="#fff3e0" style="background:#fff3e0"></button>
                        <button class="color-swatch" data-color="#fce4ec" style="background:#fce4ec"></button>
                        <button class="color-swatch" data-color="#f3e5f5" style="background:#f3e5f5"></button>
                        <button class="color-swatch" data-color="#e0f2f1" style="background:#e0f2f1"></button>
                        <button class="color-swatch" data-color="#fffde7" style="background:#fffde7"></button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modal-add-cancel">Annuler</button>
                <button class="btn-primary" id="modal-add-confirm">Ajouter</button>
            </div>
        </div>
    </div>

    <!-- Modal: Edit Product -->
    <div class="modal-overlay" id="modal-edit-product">
        <div class="modal">
            <div class="modal-header">
                <h2>Modifier le produit</h2>
                <button class="modal-close" id="modal-edit-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-product-name">Nom du produit</label>
                    <input type="text" id="edit-product-name" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="edit-product-price">Prix (€)</label>
                    <input type="number" id="edit-product-price" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="edit-product-category">Catégorie</label>
                    <select id="edit-product-category">
                        <option value="cafe">Café</option>
                        <option value="desserts">Desserts</option>
                        <option value="boissons">Boissons</option>
                        <option value="snacks">Snacks</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-product-color">Couleur</label>
                    <div class="color-picker" id="edit-color-picker">
                        <button class="color-swatch active" data-color="#f5f5f5" style="background:#f5f5f5;border:1px solid #ddd"></button>
                        <button class="color-swatch" data-color="#e8f5e9" style="background:#e8f5e9"></button>
                        <button class="color-swatch" data-color="#e3f2fd" style="background:#e3f2fd"></button>
                        <button class="color-swatch" data-color="#fff3e0" style="background:#fff3e0"></button>
                        <button class="color-swatch" data-color="#fce4ec" style="background:#fce4ec"></button>
                        <button class="color-swatch" data-color="#f3e5f5" style="background:#f3e5f5"></button>
                        <button class="color-swatch" data-color="#e0f2f1" style="background:#e0f2f1"></button>
                        <button class="color-swatch" data-color="#fffde7" style="background:#fffde7"></button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-danger" id="modal-edit-delete">Supprimer</button>
                <div style="flex:1"></div>
                <button class="btn-secondary" id="modal-edit-cancel">Annuler</button>
                <button class="btn-primary" id="modal-edit-confirm">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modal: Payment -->
    <div class="modal-overlay" id="modal-payment">
        <div class="modal modal-payment">
            <div class="modal-header">
                <h2>Encaissement</h2>
                <button class="modal-close" id="modal-payment-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="payment-total">
                    <span class="payment-label">Total à encaisser</span>
                    <span class="payment-amount" id="payment-amount">0,00 €</span>
                </div>
                <div class="payment-methods">
                    <button class="payment-method-btn" id="pay-card" data-method="card">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                            <line x1="1" y1="10" x2="23" y2="10"/>
                        </svg>
                        <span>Carte</span>
                    </button>
                    <button class="payment-method-btn" id="pay-cash" data-method="cash">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="1" x2="12" y2="23"/>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                        <span>Espèces</span>
                    </button>
                    <button class="payment-method-btn" id="pay-other" data-method="other">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                        </svg>
                        <span>Autre</span>
                    </button>
                </div>

                <!-- Cash Payment Section -->
                <div class="cash-section hidden" id="cash-section">
                    <div class="form-group">
                        <label for="cash-given">Montant reçu (€)</label>
                        <input type="number" id="cash-given" placeholder="0.00" step="0.01" min="0">
                    </div>
                    <div class="change-display hidden" id="change-display">
                        <span class="change-label">Monnaie à rendre</span>
                        <span class="change-amount" id="change-amount">0,00 €</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modal-payment-cancel">Annuler</button>
                <button class="btn-primary btn-validate-payment" id="validate-payment" disabled>Valider le paiement</button>
            </div>
        </div>
    </div>

    <!-- Modal: Payment Success -->
    <div class="modal-overlay" id="modal-success">
        <div class="modal modal-success-content">
            <div class="success-animation">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h2 class="success-title">Paiement réussi !</h2>
            <p class="success-subtitle" id="success-method-text">Paiement par carte accepté</p>
            <p class="success-amount" id="success-amount">0,00 €</p>
            <button class="btn-primary btn-new-sale" id="btn-new-sale">Nouvelle vente</button>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
